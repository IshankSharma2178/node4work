name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: eu-west-1
  ECR_REPOSITORY: nodebase
  EKS_CLUSTER: nodebase

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/nodebase"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get Git SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          GIT_SHA: ${{ steps.vars.outputs.sha_short }}
          NEXT_PUBLIC_APP_URL: https://nodebase.aws.ishankdev.me
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$GIT_SHA \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
            .

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          GIT_SHA: ${{ steps.vars.outputs.sha_short }}
        run: |
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$GIT_SHA
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Update image tag in ops repo
        env:
          OPS_REPO: ${{ secrets.OPS_REPO_NAME }}
          OPS_TOKEN: ${{ secrets.OPS_REPO_PAT }}
          GIT_SHA: ${{ steps.vars.outputs.sha_short }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          git clone https://x-access-token:${OPS_TOKEN}@github.com/${OPS_REPO}.git /tmp/nodebase-ops
          cd /tmp/nodebase-ops
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          sed -i "s|${ECR_REGISTRY}/nodebase:[^ ]*|${ECR_REGISTRY}/nodebase:${GIT_SHA}|g" prod/nodebase/deployment.yml
          sed -i "s|${ECR_REGISTRY}/nodebase:[^ ]*|${ECR_REGISTRY}/nodebase:${GIT_SHA}|g" prod/nodebase/migrate-job.yml

          git add -A
          git commit -m "chore: update image tag to ${GIT_SHA} [skip ci]"
          git push origin main
